<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Terminal: Icaro Cavalari, Backend Developer, Java e Spring">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111826"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .prompt { fill: #3fb950; }
      .cmd { fill: #c9d1d9; }
      .out { fill: #8b949e; }
      .name { fill: #f0f6fc; font-weight: 700; }
      .accent { fill: #58a6ff; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glow)"/>

  <!-- janela do terminal -->
  <rect x="60" y="40" width="1080" height="260" rx="12" fill="#0b0f14" stroke="#30363d"/>
  <rect x="60" y="40" width="1080" height="40" rx="12" fill="#161b22"/>
  <rect x="60" y="66" width="1080" height="14" fill="#161b22"/>
  <circle cx="90" cy="60" r="7" fill="#ff5f56"/>
  <circle cx="114" cy="60" r="7" fill="#ffbd2e"/>
  <circle cx="138" cy="60" r="7" fill="#27c93f"/>
  <text x="600" y="65" text-anchor="middle" class="mono out" font-size="14">icaro@dev: ~</text>

  <!-- conteúdo -->
  <g class="mono" font-size="22">
    <text x="95" y="125"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="95" y="162" class="name" font-size="34">Icaro Cavalari</text>

    <text x="95" y="208"><tspan class="prompt">$ </tspan><tspan class="cmd">cat role.txt</tspan></text>
    <text x="95" y="240" class="accent">Backend Developer · Java &amp; Spring</text>

    <text x="95" y="280"><tspan class="prompt">$ </tspan><tspan class="out">ex-capitão de Counter-Strike, agora fazendo commits</tspan><tspan class="prompt">▌<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
